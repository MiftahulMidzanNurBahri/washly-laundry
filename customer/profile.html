<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Pelanggan — Washly</title>
  <meta name="description" content="Kelola informasi akun dan preferensi layanan laundry Anda di Washly.">

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="app-header">
    <div class="container header-container">
      <a href="../index.html" class="brand-logo">
        <span>Washly</span>
      </a>

      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="order.html" class="nav-link">Buat Pesanan Baru</a>
        <a href="history.html" class="nav-link">Riwayat Pesanan</a>
        <a href="profile.html" class="nav-link active">Profil Saya</a>
      </nav>

      <div class="flex items-center gap-md">
        <div class="user-profile-widget">
          <div class="user-avatar">BS</div>
          <div class="user-info">
            <span class="user-name">Budi Santoso</span>
            <span class="user-role-label">Pelanggan</span>
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm btn-logout" title="Keluar">Keluar</button>
        <button type="button" class="mobile-nav-toggle" aria-label="Toggle menu">Menu</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container-narrow" style="padding-top: var(--space-xl); padding-bottom: var(--space-3xl);">
    
    <div class="mb-xl">
      <a href="dashboard.html" class="text-xs text-link font-semibold mb-xs" style="display:inline-block;">← Kembali ke Dashboard</a>
      <h2>Pengaturan Profil Pelanggan</h2>
      <p class="text-secondary text-sm">
        Perbarui informasi kontak dan alamat pengambilan laundry Anda.
      </p>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="flex items-center gap-md">
          <div class="user-avatar" style="width: 52px; height: 52px; font-size: var(--font-size-lg);">
            BS
          </div>
          <div>
            <h3 class="card-title">Budi Santoso</h3>
            <span class="badge badge-role mt-2xs">Pelanggan Terverifikasi</span>
          </div>
        </div>
      </div>

      <div class="card-body">
        <form id="customer-profile-form">
          <div class="form-group">
            <label for="profile-name" class="form-label">Nama Lengkap</label>
            <input type="text" id="profile-name" class="form-control" required>
          </div>

          <div class="grid grid-cols-2 gap-md">
            <div class="form-group">
              <label for="profile-email" class="form-label">Alamat Email</label>
              <input type="email" id="profile-email" class="form-control" readonly style="background-color: #F8FAFC;">
              <span class="form-hint">Email digunakan sebagai ID akun masuk utama.</span>
            </div>

            <div class="form-group">
              <label for="profile-phone" class="form-label">Nomor WhatsApp / HP</label>
              <input type="tel" id="profile-phone" class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label for="profile-address" class="form-label">Alamat Domisili</label>
            <textarea id="profile-address" class="form-textarea" rows="3" placeholder="Alamat rumah atau kantor"></textarea>
          </div>

          <div class="flex justify-end pt-md" style="border-top: 1px solid var(--color-border);">
            <button type="submit" class="btn btn-primary">
              Simpan Perubahan Profil
            </button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/validators.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/customer.js"></script>
</body>
</html>
