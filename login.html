<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Akun Washly</title>
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('washly_theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Masuk ke portal Washly Laundry untuk memantau status cucian, riwayat pesanan, atau akses dasbor admin.">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="flex items-center justify-between mb-sm">
          <a href="index.html" class="auth-logo" style="margin-bottom:0;"><span>Washly</span></a>
          <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Beralih ke mode gelap" title="Beralih Mode Gelap / Terang">
            <span class="theme-toggle-icon icon-sun" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </span>
            <span class="theme-toggle-icon icon-moon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
          </button>
        </div>



        <h1 class="auth-title">Selamat Datang Kembali</h1>
        <p class="auth-desc">Masuk untuk memantau cucian atau mengelola outlet</p>
      </div>

      <!-- Demo Accounts Shortcut Box -->
      <div class="auth-demo-accounts">
        <div class="auth-demo-title">
          <span>Coba Akun Demo Sekali Klik:</span>
        </div>
        <div class="auth-demo-buttons">
          <button type="button" class="auth-demo-pill" id="btn-fill-customer">
            Pelanggan (Budi)
          </button>
          <button type="button" class="auth-demo-pill" id="btn-fill-admin">
            Admin (Siti Aminah)
          </button>
        </div>
      </div>

      <!-- Role Selector Tabs -->
      <div class="auth-role-tabs">
        <button type="button" class="auth-role-tab active" data-role="customer">
          Sebagai Pelanggan
        </button>
        <button type="button" class="auth-role-tab" data-role="admin">
          Sebagai Admin Outlet
        </button>
      </div>

      <form id="washly-login-form" novalidate>
        <input type="hidden" id="login-role" value="customer">

        <div class="form-group">
          <label for="login-email" class="form-label">
            Alamat Email <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="nama@email.com" 
            required 
            autocomplete="email"
          >
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <div class="flex items-center justify-between mb-xs">
            <label for="login-password" class="form-label" style="margin-bottom:0;">
              Kata Sandi <span class="required">*</span>
            </label>
          </div>
          <div class="input-password-wrapper">
            <input 
              type="password" 
              id="login-password" 
              class="form-control" 
              placeholder="Masukkan kata sandi" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-password" aria-label="Lihat kata sandi">Lihat</button>
          </div>
          <div class="form-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg mt-md" style="width: 100%;">
          Masuk ke Akun
        </button>
      </form>

      <div class="auth-footer">
        Belum memiliki akun? <a href="register.html">Daftar Akun Baru</a>
        <div class="mt-xs">
          <a href="index.html" class="text-xs text-muted">← Kembali ke Halaman Utama</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
