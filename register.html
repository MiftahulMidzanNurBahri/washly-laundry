<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Akun Baru Washly</title>
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('washly_theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Daftarkan akun pelanggan Washly Laundry untuk mulai memesan laundry berkualitas, melacak cucian, dan riwayat transaksi.">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <div class="flex items-center justify-between mb-sm">
          <a href="index.html" class="auth-logo" style="margin-bottom:0;"><span>Washly</span></a>
          <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Beralih ke mode gelap" title="Beralih Mode Gelap / Terang">
            <span class="theme-toggle-icon icon-sun" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </span>
            <span class="theme-toggle-icon icon-moon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
          </button>
        </div>



        <h1 class="auth-title">Daftar Akun Pelanggan</h1>
        <p class="auth-desc">Nikmati layanan laundry profesional dengan transparansi penuh</p>
      </div>

      <form id="washly-register-form" novalidate>
        <div class="form-group">
          <label for="reg-name" class="form-label">
            Nama Lengkap <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="reg-name" 
            class="form-control" 
            placeholder="Contoh: Budi Santoso" 
            required 
            autocomplete="name"
          >
          <div class="form-error"></div>
        </div>

        <div class="grid grid-cols-2 gap-sm">
          <div class="form-group">
            <label for="reg-email" class="form-label">
              Alamat Email <span class="required">*</span>
            </label>
            <input 
              type="email" 
              id="reg-email" 
              class="form-control" 
              placeholder="nama@email.com" 
              required 
              autocomplete="email"
            >
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="reg-phone" class="form-label">
              Nomor WhatsApp / HP <span class="required">*</span>
            </label>
            <input 
              type="tel" 
              id="reg-phone" 
              class="form-control" 
              placeholder="081234567890" 
              required 
              autocomplete="tel"
            >
            <div class="form-error"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-address" class="form-label">
            Alamat Domisili
          </label>
          <textarea 
            id="reg-address" 
            class="form-textarea" 
            rows="2" 
            placeholder="Nama jalan, nomor rumah, RT/RW atau nama apartemen"
          ></textarea>
        </div>

        <div class="grid grid-cols-2 gap-sm">
          <div class="form-group">
            <label for="reg-password" class="form-label">
              Kata Sandi <span class="required">*</span>
            </label>
            <div class="input-password-wrapper">
              <input 
                type="password" 
                id="reg-password" 
                class="form-control" 
                placeholder="Minimal 6 karakter" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="btn-toggle-password" aria-label="Lihat kata sandi">Lihat</button>
            </div>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="reg-confirm-password" class="form-label">
              Ulangi Sandi <span class="required">*</span>
            </label>
            <div class="input-password-wrapper">
              <input 
                type="password" 
                id="reg-confirm-password" 
                class="form-control" 
                placeholder="Ketik ulang sandi" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="btn-toggle-password" aria-label="Lihat kata sandi">Lihat</button>
            </div>
            <div class="form-error"></div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg mt-md" style="width: 100%;">
          Daftarkan Akun Baru
        </button>
      </form>

      <div class="auth-footer">
        Sudah memiliki akun? <a href="login.html">Masuk di sini</a>
        <div class="mt-xs">
          <a href="index.html" class="text-xs text-muted">← Kembali ke Halaman Utama</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
